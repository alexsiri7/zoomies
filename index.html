<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zoomies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2b1a12; --cream:#fbefe0; --ginger:#e0853a; --sage:#8fae8b; --heart:#ff8f7a;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ink:#2b1a12;--cream:#fbefe0}}
:root[data-theme="dark"]{--ink:#2b1a12;--cream:#fbefe0}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:#f1d9bb;color:var(--ink);overflow:hidden;font-family:Nunito,system-ui,-apple-system,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0;touch-action:none}
#stage canvas{display:block;width:100%;height:100%}
#hud{position:relative;z-index:2;padding:14px 18px;pointer-events:none;color:var(--cream);text-shadow:0 2px 0 var(--ink),0 3px 10px rgba(43,26,18,.45)}
#score{font-family:Bungee,Impact,sans-serif;font-size:clamp(28px,8vw,44px);line-height:1}
#lives{font-size:17px;letter-spacing:1px;margin-top:6px;color:var(--heart)}
#kibble{font-weight:800;font-size:15px;margin-top:2px}
#best{opacity:.85;font-weight:800;font-size:13px;margin-top:2px}
#progress{position:fixed;z-index:2;top:calc(env(safe-area-inset-top,0px) + 16px);left:50%;transform:translateX(-50%);width:min(34vw,220px);text-align:center;pointer-events:none;color:var(--cream);font-weight:800;font-size:13px;text-shadow:0 2px 0 var(--ink)}
#bar{height:8px;border-radius:4px;background:rgba(43,26,18,.4);margin-top:5px;overflow:hidden}
#fill{height:100%;width:0;background:var(--cream);border-radius:4px}
#flash{position:fixed;inset:0;background:var(--heart);opacity:0;pointer-events:none;z-index:3;transition:opacity .3s}
#fade{position:fixed;inset:0;background:var(--cream);opacity:0;pointer-events:none;z-index:3;transition:opacity .35s}
#banner{position:fixed;z-index:4;left:0;right:0;top:28%;text-align:center;pointer-events:none;opacity:0;transition:opacity .4s,transform .4s;transform:translateY(10px);color:var(--cream);text-shadow:0 4px 0 var(--ink),0 6px 20px rgba(43,26,18,.4)}
#banner.show{opacity:1;transform:none}
#banner .lvl{font-family:Bungee,Impact,sans-serif;font-size:clamp(40px,12vw,72px);line-height:1}
#banner .name{font-weight:800;font-size:20px;margin-top:6px}
.panel{position:fixed;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;background:rgba(251,239,224,.72)}
.panel[hidden]{display:none}
.panel h1{font-family:Bungee,Impact,sans-serif;font-weight:400;font-size:clamp(52px,16vw,96px);line-height:.95;margin:0 0 16px;color:var(--ginger);text-shadow:0 5px 0 var(--ink)}
.panel p{max-width:30ch;margin:0 0 10px;font-size:17px;line-height:1.45;font-weight:600}
.panel .how{font-size:15px;opacity:.8;margin-bottom:26px}
.panel .big{font-family:Bungee,Impact,sans-serif;font-size:56px;margin:4px 0 6px;color:var(--ginger)}
button{font:800 19px Nunito,system-ui,sans-serif;background:var(--ginger);color:var(--cream);border:0;border-radius:999px;padding:15px 44px;cursor:pointer;box-shadow:0 5px 0 var(--ink)}
button:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
button:focus-visible{outline:3px solid var(--sage);outline-offset:4px}
#mute{position:fixed;z-index:5;top:calc(env(safe-area-inset-top,0px) + 12px);right:14px;padding:10px 13px;font-size:20px;line-height:1;background:rgba(43,26,18,.4);box-shadow:none;border-radius:14px}
#mute:active{transform:none;box-shadow:none}
</style>
</head>
<body>
<div id="stage"></div>
<div id="hud"><div id="score">0</div><div id="lives"></div><div id="kibble">0 kibble</div><div id="best"></div></div>
<div id="progress"><div id="lvlLabel">Level 1</div><div id="bar"><div id="fill"></div></div></div>
<div id="flash"></div>
<div id="fade"></div>
<div id="banner"><div class="lvl" id="bLvl">Level 2</div><div class="name" id="bName">The garden</div></div>
<button id="mute" aria-label="Mute sound">🔊</button>

<section class="panel" id="menu">
  <h1>Zoomies</h1>
  <p>It's 3am and the cat is off. Nine lives, a hallway full of furniture, a garden out the back door, and the rooftops beyond.</p>
  <p class="how">Swipe left or right to steer.<br>Swipe up or tap to jump.</p>
  <button id="playBtn">Play</button>
</section>

<section class="panel" id="over" hidden>
  <p id="overMsg">Out of lives</p>
  <div class="big" id="finalScore">0</div>
  <p class="how" id="overBest"></p>
  <button id="againBtn">Play again</button>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const LANES=[-2.3,0,2.3];
const LEVEL_LEN=650;
const MAX_LIVES=9;
const reduceMotion=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
const $=id=>document.getElementById(id);
const lam=(c,o)=>new THREE.MeshLambertMaterial(Object.assign({color:c},o||{}));

let best=0;
try{best=parseInt(localStorage.getItem('zoomies-best')||'0',10)||0}catch(e){}
function saveBest(){try{localStorage.setItem('zoomies-best',String(best))}catch(e){}}
$('best').textContent=best?'Best '+best:'';

// ---------- Sound (all synthesised, no files) ----------
let actx=null,master=null,musicGain=null,noiseBuf=null,muted=false;
try{muted=localStorage.getItem('zoomies-muted')==='1'}catch(e){}
function initAudio(){
  if(!actx){
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    actx=new AC();master=actx.createGain();master.gain.value=muted?0:0.8;master.connect(actx.destination);
    musicGain=actx.createGain();musicGain.gain.value=0.2;musicGain.connect(master);
  }
  if(actx.state==='suspended')actx.resume();
}
function tone(freq,dur,type,vol,when,dest,slideTo){
  if(!actx)return;const t0=when||actx.currentTime;
  const o=actx.createOscillator(),g=actx.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(freq,t0);
  if(slideTo)o.frequency.exponentialRampToValueAtTime(slideTo,t0+dur);
  g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(vol,t0+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g);g.connect(dest||master);o.start(t0);o.stop(t0+dur+0.02);
}
function noise(dur,vol,freq,q,delay){
  if(!actx)return;
  if(!noiseBuf){noiseBuf=actx.createBuffer(1,actx.sampleRate*0.5,actx.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}
  const t0=actx.currentTime+(delay||0);const src=actx.createBufferSource();src.buffer=noiseBuf;
  const f=actx.createBiquadFilter();f.type='bandpass';f.frequency.value=freq;f.Q.value=q||1;
  const g=actx.createGain();g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  src.connect(f);f.connect(g);g.connect(master);src.start(t0);src.stop(t0+dur);
}
function meow(delay,pitch){
  if(!actx)return;const t0=actx.currentTime+(delay||0),p=pitch||1;
  const o=actx.createOscillator();o.type='sawtooth';
  const f=actx.createBiquadFilter();f.type='bandpass';f.Q.value=3;
  const g=actx.createGain();
  o.frequency.setValueAtTime(520*p,t0);o.frequency.linearRampToValueAtTime(840*p,t0+0.13);
  o.frequency.linearRampToValueAtTime(760*p,t0+0.32);o.frequency.exponentialRampToValueAtTime(420*p,t0+0.62);
  f.frequency.setValueAtTime(900,t0);f.frequency.linearRampToValueAtTime(2300,t0+0.15);f.frequency.linearRampToValueAtTime(1100,t0+0.62);
  g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(0.35,t0+0.05);
  g.gain.setValueAtTime(0.3,t0+0.42);g.gain.exponentialRampToValueAtTime(0.0001,t0+0.66);
  o.connect(f);f.connect(g);g.connect(master);o.start(t0);o.stop(t0+0.7);
}
const sfx={
  crunch(){noise(0.06,0.55,2000+Math.random()*900,2);noise(0.05,0.35,1600+Math.random()*600,2,0.05);},
  bowl(){if(!actx)return;[784,988,1175,1568].forEach((f,i)=>tone(f,0.28,'triangle',0.2,actx.currentTime+i*0.07));noise(0.08,0.5,2400,2,0.05);noise(0.08,0.4,1900,2,0.13);},
  jump(){tone(360,0.18,'sine',0.22,null,null,760);},
  hit(){noise(0.25,0.6,160,0.7);tone(130,0.25,'sine',0.4,null,null,55);meow(0.12,1.15);},
  crash(){noise(0.3,0.7,160,0.7);tone(130,0.3,'sine',0.45,null,null,50);meow(0.2,0.85);},
  level(){if(!actx)return;[523,659,784,1047,1319].forEach((f,i)=>tone(f,0.3,'triangle',0.22,actx.currentTime+i*0.09));meow(0.5,1.25);}
};
const N={C5:523,D5:587,E5:659,G5:784,A5:880,C6:1047};
const MEL=['E5','G5','A5',0,'G5','E5','D5',0,'C5','D5','E5','G5','A5',0,'G5',0,
           'A5','C6','A5','G5','E5',0,'D5','E5','G5',0,'E5','D5','C5',0,0,0].map(n=>n?N[n]:0);
const BASS=[[131,110,87,98],[98,131,110,87],[110,87,98,82]];
let musicOn=false,mStep=0,nextNote=0,mTimer=null,tune=0;
function startMusic(){if(!actx||musicOn)return;musicOn=true;mStep=0;nextNote=actx.currentTime+0.08;mTimer=setInterval(schedule,25);}
function stopMusic(){musicOn=false;clearInterval(mTimer);}
function schedule(){
  const bpm=128+Math.min(48,Math.max(0,(speed-17)*2));const sd=60/bpm/2;
  const tr=[1,1.122,0.84][tune],bass=BASS[tune],wave=['triangle','square','sine'][tune],vol=[0.32,0.12,0.4][tune];
  while(nextNote<actx.currentTime+0.12){
    const m=MEL[mStep%MEL.length];if(m)tone(m*tr,sd*0.9,wave,vol,nextNote,musicGain);
    if(mStep%8===0)tone(bass[Math.floor(mStep/8)%4],sd*7,'sine',0.55,nextNote,musicGain);
    if(mStep%8===4)tone(bass[Math.floor(mStep/8)%4]*1.5,sd*3,'sine',0.3,nextNote,musicGain);
    nextNote+=sd;mStep++;
  }
}
function setMuteUI(){const b=$('mute');b.textContent=muted?'🔇':'🔊';b.setAttribute('aria-label',muted?'Turn sound on':'Mute sound');}
setMuteUI();
$('mute').addEventListener('click',()=>{
  muted=!muted;try{localStorage.setItem('zoomies-muted',muted?'1':'0')}catch(e){}
  initAudio();if(master)master.gain.setTargetAtTime(muted?0:0.8,actx.currentTime,0.02);setMuteUI();
});

// ---------- Renderer / scene ----------
const stage=$('stage');
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
stage.appendChild(renderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0xf1d9bb,28,95);
const camera=new THREE.PerspectiveCamera(62,1,0.1,400);
const camBase=new THREE.Vector3(0,3.4,7);
const hemi=new THREE.HemisphereLight(0xfff0dc,0x8a5a3a,0.95);scene.add(hemi);
const sunL=new THREE.DirectionalLight(0xffd6a0,0.75);sunL.position.set(3,9,4);scene.add(sunL);

function canvasTex(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'));const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;return t;}
function strip(w,tex,z,y){const m=new THREE.Mesh(new THREE.PlaneGeometry(w,400),new THREE.MeshLambertMaterial({map:tex}));m.rotation.x=-Math.PI/2;m.position.set(0,y||0,-150);return m;}

const box=(w,h,d,c,x,y,z)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),typeof c==='number'?lam(c):c);m.position.set(x||0,y||0,z||0);return m;};
const cyl=(rt,rb,h,seg,c,x,y,z)=>{const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg),typeof c==='number'?lam(c):c);m.position.set(x||0,y||0,z||0);return m;};
// ===== Environment 1: inside =====
function makeInside(){
  const root=new THREE.Group();
  const floorTex=canvasTex(128,128,g=>{
    const woods=['#b07a4f','#a36f47','#bb8658','#9d6a44'];
    for(let i=0;i<4;i++){g.fillStyle=woods[i];g.fillRect(i*32,0,32,128);}
    g.fillStyle='rgba(60,35,20,.45)';
    for(let i=0;i<4;i++){g.fillRect(i*32,0,2,128);g.fillRect(i*32,(i*37)%128,32,2);}
  });floorTex.repeat.set(3,60);root.add(strip(10,floorTex));
  const rugTex=canvasTex(128,128,g=>{
    g.fillStyle='#b4443a';g.fillRect(0,0,128,128);
    g.fillStyle='#e9c46a';g.fillRect(0,0,6,128);g.fillRect(122,0,6,128);
    g.fillStyle='rgba(251,239,224,.6)';[128/3,256/3].forEach(x=>g.fillRect(x-2,0,4,60));
    g.fillStyle='rgba(233,196,106,.5)';g.beginPath();g.moveTo(64,70);g.lineTo(76,94);g.lineTo(64,118);g.lineTo(52,94);g.fill();
  });rugTex.repeat.set(1,50);root.add(strip(7,rugTex,0,0.01));
  const wp=()=>canvasTex(128,128,g=>{
    g.fillStyle='#9bb89a';g.fillRect(0,0,128,128);
    g.fillStyle='#b3cbb0';g.fillRect(0,0,40,128);g.fillRect(64,0,40,128);
    g.fillStyle='#fbefe0';for(let y=12;y<128;y+=32){g.fillRect(50,y,4,4);g.fillRect(114,y+16,4,4);}
  });
  const wL=wp(),wR=wp();wL.repeat.set(100,1.5);wR.repeat.set(100,1.5);
  const wallGeo=new THREE.PlaneGeometry(400,7);
  const a=new THREE.Mesh(wallGeo,new THREE.MeshLambertMaterial({map:wL}));a.rotation.y=Math.PI/2;a.position.set(-5,3.5,-150);root.add(a);
  const b=new THREE.Mesh(wallGeo,new THREE.MeshLambertMaterial({map:wR}));b.rotation.y=-Math.PI/2;b.position.set(5,3.5,-150);root.add(b);
  const skirtGeo=new THREE.BoxGeometry(0.1,0.35,400),skirtMat=lam(0xfbefe0);
  [-4.95,4.95].forEach(x=>{const s=new THREE.Mesh(skirtGeo,skirtMat);s.position.set(x,0.17,-150);root.add(s);});
  const frameColors=[0xe9c46a,0xe07a5f,0x3d5a80,0xf4a261,0x81b29a];
  const decor=[];
  function place(g,z){const side=Math.random()<.5?-1:1;g.position.x=side*4.93;g.position.z=z;}
  for(let i=0;i<24;i++){
    const g=new THREE.Group(),kind=i%3;
    if(kind===0){g.add(new THREE.Mesh(new THREE.BoxGeometry(0.12,1.1,1.4),lam(0x6b4226)),new THREE.Mesh(new THREE.BoxGeometry(0.14,0.8,1.1),lam(frameColors[i%5])));g.position.y=2.6;}
    else if(kind===1){const k=new THREE.Mesh(new THREE.SphereGeometry(0.09,8,8),lam(0xe9c46a));k.position.set(0,-0.1,0.55);g.add(new THREE.Mesh(new THREE.BoxGeometry(0.12,3,1.6),lam(0xfbefe0)),k);g.position.y=1.5;}
    else{g.add(new THREE.Mesh(new THREE.BoxGeometry(0.12,1.6,1.8),lam(0xfbefe0)),new THREE.Mesh(new THREE.BoxGeometry(0.14,1.3,1.5),new THREE.MeshBasicMaterial({color:0x2f3f6b})),new THREE.Mesh(new THREE.BoxGeometry(0.16,1.3,0.08),lam(0xfbefe0)));g.position.y=2.8;}
    place(g,-i*9-Math.random()*4);root.add(g);decor.push(g);
  }
  return {root,bg:new THREE.Color(0xf1d9bb),fog:0xf1d9bb,near:28,far:95,hemi:[0xfff0dc,0x8a5a3a],light:[0.95,0xffd6a0,0.75],
    update(d){floorTex.offset.y+=d/(400/60);rugTex.offset.y+=d/8;wL.offset.x+=d/4;wR.offset.x-=d/4;
      decor.forEach(g=>{g.position.z+=d;if(g.position.z>12)place(g,-200-Math.random()*20);});}};
}

// ===== Environment 2: garden =====
function makeGarden(){
  const root=new THREE.Group();
  const ground=new THREE.Mesh(new THREE.PlaneGeometry(400,400),new THREE.MeshLambertMaterial({color:0x6fa35a}));
  ground.rotation.x=-Math.PI/2;ground.position.set(0,-0.03,-150);root.add(ground);
  const grassTex=canvasTex(64,64,g=>{g.fillStyle='#7fb069';g.fillRect(0,0,64,64);
    for(let i=0;i<70;i++){g.fillStyle=i%2?'#6a9a55':'#94c47a';g.fillRect(Math.random()*64,Math.random()*64,2,5);}});
  grassTex.repeat.set(8,80);root.add(strip(40,grassTex,0,-0.01));
  const pathTex=canvasTex(128,128,g=>{
    g.fillStyle='#d9cbb0';g.fillRect(0,0,128,128);
    g.fillStyle='#c4b394';g.fillRect(0,0,128,3);g.fillRect(0,64,128,3);g.fillRect(64,0,3,64);g.fillRect(20,64,3,64);g.fillRect(100,64,3,64);
    g.fillStyle='#8a7a5c';g.fillRect(0,0,5,128);g.fillRect(123,0,5,128);
    g.fillStyle='rgba(255,255,255,.55)';[128/3,256/3].forEach(x=>g.fillRect(x-2,20,4,30));
  });pathTex.repeat.set(1,50);root.add(strip(7,pathTex,0,0.01));
  const fence=()=>canvasTex(64,64,g=>{
    g.fillStyle='#f5efe2';
    for(let x=4;x<64;x+=16){g.fillRect(x,14,10,50);g.beginPath();g.moveTo(x,14);g.lineTo(x+5,4);g.lineTo(x+10,14);g.fill();}
    g.fillRect(0,24,64,5);g.fillRect(0,48,64,5);
  });
  const fL=fence(),fR=fence();fL.repeat.set(200,1);fR.repeat.set(200,1);
  const fGeo=new THREE.PlaneGeometry(400,1.5);
  const fm=t=>new THREE.MeshLambertMaterial({map:t,transparent:true,alphaTest:.5,side:THREE.DoubleSide});
  const a=new THREE.Mesh(fGeo,fm(fL));a.rotation.y=Math.PI/2;a.position.set(-5,0.75,-150);root.add(a);
  const b=new THREE.Mesh(fGeo,fm(fR));b.rotation.y=-Math.PI/2;b.position.set(5,0.75,-150);root.add(b);
  const decor=[];
  function place(g,z){const side=Math.random()<.5?-1:1;g.position.x=side*(7+Math.random()*14);g.position.z=z;const s=0.8+Math.random()*0.8;g.scale.set(s,s,s);}
  const leafMats=[lam(0x4f7d4a),lam(0x5f9a52),lam(0x3f6b3c)];
  for(let i=0;i<30;i++){
    const g=new THREE.Group();
    const trunk=new THREE.Mesh(new THREE.CylinderGeometry(0.25,0.35,2.4,6),lam(0x7a4a2c));trunk.position.y=1.2;g.add(trunk);
    const top=new THREE.Mesh(new THREE.IcosahedronGeometry(1.6,0),leafMats[i%3]);top.position.y=3.3;g.add(top);
    if(i%3===0){const f=new THREE.Mesh(new THREE.SphereGeometry(0.2,6,6),lam(0xe07a5f));f.position.set(0.8,3.6,0.9);g.add(f);}
    place(g,-Math.random()*210);root.add(g);decor.push(g);
  }
  const sky=canvasTex(2,256,g=>{const gr=g.createLinearGradient(0,0,0,256);gr.addColorStop(0,'#6ec0e0');gr.addColorStop(.75,'#bfe6ee');gr.addColorStop(1,'#e6f5f0');g.fillStyle=gr;g.fillRect(0,0,2,256);});
  return {root,bg:sky,fog:0xd9eff0,near:32,far:115,hemi:[0xfffbe8,0x4f7d4a],light:[1.0,0xfff2d0,0.8],
    update(d){grassTex.offset.y+=d/5;pathTex.offset.y+=d/8;fL.offset.x+=d/2;fR.offset.x-=d/2;
      decor.forEach(g=>{g.position.z+=d;if(g.position.z>14)place(g,-200-Math.random()*20);});}};
}

// ===== Environment 3: rooftops at night =====
function makeRooftops(){
  const root=new THREE.Group();
  const slate=()=>canvasTex(128,128,g=>{
    g.fillStyle='#4a5468';g.fillRect(0,0,128,128);
    for(let r=0;r<4;r++){const off=r%2?16:0;for(let c=-1;c<4;c++){
      g.fillStyle=['#525d73','#46506a','#58637a'][(r+c+3)%3];g.fillRect(c*32+off+1,r*32+1,30,30);}}
  });
  const roofTex=slate();roofTex.repeat.set(1,50);
  const path=strip(7,canvasTex(128,128,g=>{}),0,0);path.material.map=roofTex;

let things=[];
function add(type,sub,lane,z){
  const L=LEVELS[levelIdx%LEVELS.length];let m;
  if(type==='tall')m=L.tall[sub][0]();
  else if(type==='low')m=L.low[sub][0]();
  else if(type==='kibble'){m=kibble();m.position.y=0.9;}
  else if(type==='bowl'){m=bowl();m.position.y=0.2;}
  else m=L.finish();
  m.position.x=lane===null?0:LANES[lane];m.position.z=z;scene.add(m);
  things.push({type,sub,mesh:m});
}
const pick=o=>{const k=Object.keys(o);return k[Math.floor(Math.random()*k.length)];};
function spawnRow(z){
  const L=LEVELS[levelIdx%LEVELS.length];const free=Math.floor(Math.random()*3);
  for(let l=0;l<3;l++){
    if(l===free){
      if(Math.random()<.12)add('bowl',null,l,z-1);
      else if(Math.random()<.65)for(let k=0;k<3;k++)add('kibble',null,l,z-k*2.2);
      continue;
    }
    const r=Math.random();
    if(r<.45)add('tall',pick(L.tall),l,z);else if(r<.78)add('low',pick(L.low),l,z);
  }
}
function clearThings(){things.forEach(t=>scene.remove(t.mesh));things=[];}

// ---------- State ----------
let state='menu',lane=1,py=BASE_Y,vy=0,speed=9,dist=0,eaten=0,bonus=0,nextSpawn=0,shake=0,t=0,run=0;
let lives=MAX_LIVES,invuln=0,levelIdx=0,levelDist=0,finishSpawned=false,transitioning=false,token=0;
function score(){return Math.floor(dist/2)+eaten*10+bonus;}
function updateHud(){
  $('kibble').textContent=eaten+' kibble';
  $('lives').textContent='♥'.repeat(lives)+'♡'.repeat(MAX_LIVES-lives);
  $('lives').setAttribute('aria-label',lives+' lives left');
  $('lvlLabel').textContent='Level '+(levelIdx+1);
}
function showBanner(n,name){
  $('bLvl').textContent='Level '+n;$('bName').textContent=name;
  $('banner').classList.add('show');setTimeout(()=>$('banner').classList.remove('show'),1900);
}
function levelSpeed(){return Math.min(30,17+levelIdx*2.5);}

function start(){
  token++;clearThings();lane=1;cat.position.x=0;py=BASE_Y;vy=0;dist=0;eaten=0;bonus=0;nextSpawn=28;
  lives=MAX_LIVES;invuln=0;levelIdx=0;levelDist=0;finishSpawned=false;transitioning=false;cat.visible=true;
  setEnv(0);tune=0;speed=levelSpeed();
  updateHud();state='play';$('menu').hidden=true;$('over').hidden=true;
  initAudio();startMusic();showBanner(1,LEVELS[0].name);
}
function nextLevel(){
  const my=++token;transitioning=true;bonus+=100;sfx.level();
  $('fade').style.opacity=1;
  setTimeout(()=>{
    if(my!==token)return;
    levelIdx++;clearThings();const L=LEVELS[levelIdx%LEVELS.length];
    setEnv(L.env);tune=L.tune;levelDist=0;finishSpawned=false;nextSpawn=30;speed=levelSpeed();
    updateHud();$('fade').style.opacity=0;
    const lap=Math.floor(levelIdx/LEVELS.length);
    showBanner(levelIdx+1,L.name+(lap?' (faster!)':''));
    transitioning=false;
  },420);
}
function hit(what){
  lives--;updateHud();
  $('flash').style.opacity=.45;setTimeout(()=>$('flash').style.opacity=0,110);
  shake=reduceMotion?0:0.35;
  if(lives<=0){gameOver(what);return;}
  sfx.hit();invuln=1.6;
}
function gameOver(what){
  sfx.crash();stopMusic();state='dying';shake=reduceMotion?0:0.45;token++;
  const s=score();const nb=s>best;if(nb){best=s;saveBest();}
  setTimeout(()=>{
    state='over';cat.visible=true;
    $('overMsg').textContent='Your ninth life ended on '+what+', on level '+(levelIdx+1)+', after '+eaten+' kibble';
    $('finalScore').textContent=s;
    $('overBest').textContent=nb?'New best!':'Best '+best;
    $('best').textContent='Best '+best;
    $('over').hidden=false;$('againBtn').focus();
  },650);
}

function steer(d){if(state!=='play')return;lane=Math.max(0,Math.min(2,lane+d));}
function jump(){if(state!=='play')return;if(py<=BASE_Y+0.01){vy=9.5;sfx.jump();}}

$('playBtn').addEventListener('click',()=>{start();meow(0.05,1.1);});
$('againBtn').addEventListener('click',start);
window.addEventListener('keydown',e=>{
  const k=e.key;
  if(k==='ArrowLeft'||k==='a'){steer(-1);e.preventDefault();}
  else if(k==='ArrowRight'||k==='d'){steer(1);e.preventDefault();}
  else if(k==='ArrowUp'||k==='w'||k===' '){jump();e.preventDefault();}
  else if(k==='Enter'&&(state==='menu'||state==='over'))start();
});
let sx=0,sy=0,handled=false,down=false;
stage.addEventListener('pointerdown',e=>{down=true;sx=e.clientX;sy=e.clientY;handled=false;});
stage.addEventListener('pointermove',e=>{
  if(!down||handled)return;
  const dx=e.clientX-sx,dy=e.clientY-sy;
  if(Math.abs(dx)>28&&Math.abs(dx)>Math.abs(dy)){steer(dx>0?1:-1);handled=true;}
  else if(dy<-28&&Math.abs(dy)>Math.abs(dx)){jump();handled=true;}
});
stage.addEventListener('pointerup',()=>{if(down&&!handled)jump();down=false;});
stage.addEventListener('pointercancel',()=>{down=false;});

function resize(){
  const w=window.innerWidth,h=window.innerHeight,a=w/h;
  renderer.setSize(w,h,false);
  camera.aspect=a;camera.fov=a<1?62+(1-a)*42:62;camera.updateProjectionMatrix();
}
window.addEventListener('resize',resize);resize();
updateHud();

// ---------- Loop ----------
let last=performance.now();
function frame(now){
  const dt=Math.min((now-last)/1000,0.05);last=now;t+=dt;
  const spd=state==='play'?speed:(state==='dying'?0:8);
  const d=spd*dt;

  if(state==='play'){
    speed=Math.min(44,speed+0.3*dt);
    dist+=d;levelDist+=d;
    if(!transitioning&&!finishSpawned){
      if(levelDist<LEVEL_LEN-15){nextSpawn-=d;if(nextSpawn<=0){spawnRow(-110);nextSpawn=Math.max(9,17-speed*0.18)+Math.random()*5;}}
      if(levelDist>=LEVEL_LEN){add('finish',null,null,-110);finishSpawned=true;}
    }
    vy-=26*dt;py+=vy*dt;if(py<BASE_Y){py=BASE_Y;vy=0;}
    if(invuln>0){invuln-=dt;cat.visible=invuln<=0||Math.floor(invuln*12)%2===0;}
    $('score').textContent=score();
    $('fill').style.width=Math.min(100,levelDist/LEVEL_LEN*100)+'%';
  }

  env.update(d);

  run+=spd*dt*0.9;
  const air=py>BASE_Y+0.01;
  legs.forEach((l,i)=>{l.rotation.x=air?(i<2?-0.8:0.8):Math.sin(run+(i%2?Math.PI:0)+(i<2?0:Math.PI/2))*0.9*Math.min(1,spd/10);});
  tail.rotation.z=Math.sin(t*6)*0.35;tail.rotation.x=0.5+(air?0.5:0);
  head.rotation.x=air?-0.15:Math.sin(run*2)*0.04;
  const tx=LANES[lane];
  cat.position.x+=(tx-cat.position.x)*Math.min(1,dt*13);
  cat.position.y=py+(air?0:Math.abs(Math.sin(run))*0.07);
  cat.rotation.z=(cat.position.x-tx)*0.25;cat.rotation.y=(cat.position.x-tx)*0.3;cat.rotation.x=vy*0.02;
  shadow.position.x=cat.position.x;
  const s=Math.max(.4,1-(py-BASE_Y)*0.25);shadow.scale.set(s,s,s);

  const L=LEVELS[levelIdx%LEVELS.length];
  for(let i=things.length-1;i>=0;i--){
    const o=things[i],m=o.mesh;
    m.position.z+=d;
    if(o.type==='kibble'){m.rotation.y+=dt*3;m.position.y=0.9+Math.sin(t*4+m.position.z)*0.1;}
    if(state==='play'){
      const dz=Math.abs(m.position.z),dx=Math.abs(m.position.x-cat.position.x);
      if(o.type==='finish'){
        if(m.position.z>-0.5&&!transitioning){nextLevel();}
      }else if(o.type==='kibble'){
        if(dz<1&&dx<1&&Math.abs(m.position.y-py)<1.2){eaten++;sfx.crunch();updateHud();scene.remove(m);things.splice(i,1);continue;}
      }else if(o.type==='bowl'){
        if(dz<1&&dx<1&&py<1.6){eaten+=5;bonus+=25;sfx.bowl();updateHud();scene.remove(m);things.splice(i,1);continue;}
      }else if(invuln<=0){
        const hitIt=o.type==='tall'?(dz<0.95&&dx<1.2):(dz<0.7&&dx<1.2&&py<1.3);
        if(hitIt){hit(L[o.type][o.sub][1]);scene.remove(m);things.splice(i,1);continue;}
      }
    }
    if(m.position.z>9){scene.remove(m);things.splice(i,1);}
  }

  camera.position.set(camBase.x+cat.position.x*0.45,camBase.y+(py-BASE_Y)*0.25,camBase.z);
  if(shake>0){shake-=dt;camera.position.x+=(Math.random()-.5)*shake;camera.position.y+=(Math.random()-.5)*shake;}
  camera.lookAt(cat.position.x*0.6,1,-8);

  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
