<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zoomies</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%90%88%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage"></div>
<div id="hud"><div id="score">0</div><div id="lives"></div><div id="kibble">0 kibble</div><div id="best"></div></div>
<div id="progress"><div id="lvlLabel">Level 1</div><div id="bar"><div id="fill"></div></div></div>
<div id="flash"></div>
<div id="fade"></div>
<div id="banner"><div class="lvl" id="bLvl">Level 2</div><div class="name" id="bName">The garden</div></div>
<button id="mute" aria-label="Mute sound">🔊</button>

<section class="panel" id="menu">
  <h1>Zoomies</h1>
  <p>It's 3am and the cat is off. Nine lives, a hallway full of furniture, a garden out the back door, and the rooftops beyond.</p>
  <p class="how">Swipe left or right to steer.<br>Swipe up or tap to jump.</p>
  <button id="playBtn">Play</button>
</section>

<section class="panel" id="over" hidden>
  <p id="overMsg">Out of lives</p>
  <div class="big" id="finalScore">0</div>
  <p class="how" id="overBest"></p>
  <button id="againBtn">Play again</button>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" integrity="sha512-dLxUelApnYxpLt6K2iomGngnHO83iUvZytA3YjDUCjT0HDOHKXnVYdf3hU4JjM8uEhxf9nD1/ey98U3t2vZ0qQ==" crossorigin="anonymous"></script>
<script src="game.js"></script>
</body>
</html>
